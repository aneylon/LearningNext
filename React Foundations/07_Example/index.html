<html>
  <head>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@latest?dev",
          "react-dom/client": "https://esm.sh/react-dom@latest/client?dev",
          "react/jsx-runtime": "https://esm.sh/react@latest/jsx-runtime?dev"
        }
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone@latest/babel.min.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="text/babel" data-type="module" data-presets="react">
      import React from "react";
      import { createRoot } from "react-dom/client";

      const domNode = document.getElementById("app");

      function Header({ title = "Default Title" }) {
        return (
          <div>
            <h1>{title}</h1>
          </div>
        );
      }

      function HomePage() {
        const names = ["Ada", "Grace", "Margaret"];
        const [likes, setLikes] = React.useState(0);

        function handleClick() {
          console.log("clicked it!");
          setLikes(likes + 1);
        }
        return (
          <div>
            <Header title="React" />
            <Header title="Something Else" />
            <Header />
            <ul>
              {names.map((name) => (
                <li key={name}>{name}</li>
              ))}
            </ul>
            <button onClick={handleClick}>Like({likes})</button>
          </div>
        );
      }

      const root = createRoot(domNode);
      root.render(<HomePage />);
    </script>
  </body>
</html>
